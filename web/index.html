<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>atColin</title>
    <meta
      name="description"
      content="Projekte von atColin. Sniper Range und weitere Apps über die Icons öffnen."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Serif:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="wrap wrap-hub">
      <h1 class="hub-brand">atColin</h1>
      <p class="hub-lead">Projekte. Ein Icon öffnen — später kommen weitere dazu.</p>

      <nav class="tiles" aria-label="Projekte">
        <a class="tile" href="/sniper/">
          <img src="/icons/sniper.svg" width="88" height="88" alt="" />
          <span>Sniper Range</span>
        </a>
        <!-- Nächstes Projekt: dieses <a class="tile"> kopieren, Icon nach /icons/ legen. -->
        <div class="tile tile-soon" aria-hidden="true">
          <div class="tile-mark">+</div>
          <span>Bald</span>
        </div>
      </nav>
    </main>
  </body>
</html>
